name: Emu88 Headless CLAP Sync

# Merges upstream's main into emu88-clap once a day. The push starts emu88-clap.yml, which builds the
# plugins and replaces the emu88-clap-latest pre-release.
#
# It pushes with the SYNC_TOKEN secret, a personal access token with Contents and Workflows write access
# to this repository, because the workflow's own token can do neither of the two things it has to:
# push a merge that brings in upstream changes to .github/workflows, and start a workflow by pushing.
#
# When upstream does not merge cleanly the run fails and nothing is pushed: merge it by hand.

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
    - name: Check token
      env:
        SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
      run: |
        if [ -z "$SYNC_TOKEN" ]; then
          echo "::error::The SYNC_TOKEN secret is missing, see the top of emu88-clap-sync.yml"
          exit 1
        fi

    - uses: actions/checkout@v4
      with:
        ref: emu88-clap
        fetch-depth: 0
        token: ${{ secrets.SYNC_TOKEN }}

    - name: Merge upstream
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

        git remote add upstream https://github.com/dsp56300/gearmulator.git
        git fetch --no-tags upstream main

        if git merge-base --is-ancestor upstream/main HEAD; then
          echo "Nothing new upstream"
          exit 0
        fi

        if ! git merge --no-edit -m "Merge upstream/main into emu88-clap" upstream/main; then
          git merge --abort
          echo "::error::upstream/main does not merge cleanly into emu88-clap, merge it by hand"
          exit 1
        fi

        git push origin HEAD:emu88-clap
